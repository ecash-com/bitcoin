name: Build and push Docker image

on:
  push:
    branches:
      - master
      - alphanet
      - betanet
      - betanet-bridge
  workflow_dispatch:
  pull_request:

jobs:
  # Build and push ALL events. We'll make sure to give the images
  # sensible tags, so there's no confusion around what's 'dev' builds
  # through PRs, and what's proper 'master' builds.
  #
  # Official GitHub docs on this: https://docs.github.com/en/actions/use-cases-and-examples/publishing-packages/publishing-docker-images
  build-push-docker:
    runs-on: ubuntu-latest
    # needed to push to GHCR
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Docker meta
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/bitcoin
          # generate Docker tags based on the following events/attributes
          tags: |
            # creates a tag for each push
            type=sha,event=push

            # creates a tag for each pr
            type=ref,event=pr

            # set latest tag for default branch
            type=raw,value=latest,enable={{is_default_branch}}

            # moving tags for the network branches
            type=raw,value=alphanet,enable=${{ github.ref == 'refs/heads/alphanet' }}
            type=raw,value=betanet,enable=${{ github.ref == 'refs/heads/betanet' }}

            # moving tag for the bridge branch, which builds the seed
            # node that also speaks Bitcoin's network magic
            type=raw,value=betanet-bridge,enable=${{ github.ref == 'refs/heads/betanet-bridge' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and maybe push) Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Caching Docker builds on CI is an eternally
          # difficult task. From the official docs:
          # "In most cases you want to use the inline cache exporter"
          #
          # https://docs.docker.com/build/ci/github-actions/cache/#inline-cache
          # prettier-ignore
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/bitcoin:latest
          cache-to: type=inline
